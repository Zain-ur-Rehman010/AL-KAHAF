# AlKahaf Online Academy - Apache Virtual Host Configuration
# This file should be added to your Apache configuration (httpd.conf or sites-available/)
# For better performance than .htaccess (compiled once at server startup)

<VirtualHost *:80>
    ServerName alkahafonlineacademy.com
    ServerAlias www.alkahafonlineacademy.com
    DocumentRoot /path/to/alkahaf/frontend

    # Redirect HTTP to HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName alkahafonlineacademy.com
    ServerAlias www.alkahafonlineacademy.com
    DocumentRoot /path/to/alkahaf/frontend

    # SSL Configuration (Let's Encrypt or your SSL certificate)
    SSLEngine on
    SSLCertificateFile /path/to/ssl/cert.pem
    SSLCertificateKeyFile /path/to/ssl/key.pem
    SSLCertificateChainFile /path/to/ssl/chain.pem

    # Enable Rewrite Engine
    RewriteEngine On

    # Set directory index
    DirectoryIndex index.html

    #########################
    # CLEAN URL REWRITES
    #########################

    # Home page
    RewriteRule ^/home/?$ /index.html [L]

    # Course pages - CLEAN URLs (file structure hidden)
    RewriteRule ^/courses/?$ /src/pages/courses/course-grid.html [L]
    RewriteRule ^/courses/grid/?$ /src/pages/courses/course-grid.html [L]
    RewriteRule ^/courses/list/?$ /src/pages/courses/course-list.html [L]
    RewriteRule ^/course-details/?$ /src/pages/courses/course-details.html [L]

    # Authentication pages
    RewriteRule ^/login/?$ /src/pages/auth/login.html [L]
    RewriteRule ^/register/?$ /src/pages/auth/register.html [L]
    RewriteRule ^/forgot-password/?$ /src/pages/auth/forgot-password.html [L]
    RewriteRule ^/reset-password/?$ /src/pages/auth/reset-password.html [L]

    # Student Dashboard
    RewriteRule ^/student/?$ /src/pages/student/student-dashboard.html [L]
    RewriteRule ^/student/dashboard/?$ /src/pages/student/student-dashboard.html [L]
    RewriteRule ^/student/courses/?$ /src/pages/student/student-courses.html [L]
    RewriteRule ^/student/course-play/?$ /src/pages/student/student-course-play.html [L]
    RewriteRule ^/student/quiz/?$ /src/pages/student/student-quiz.html [L]
    RewriteRule ^/student/profile/?$ /src/pages/student/student-profile.html [L]
    RewriteRule ^/student/settings/?$ /src/pages/student/student-settings.html [L]

    # Instructor Dashboard
    RewriteRule ^/instructor/?$ /src/pages/instructor/instructor-dashboard.html [L]
    RewriteRule ^/instructor/dashboard/?$ /src/pages/instructor/instructor-dashboard.html [L]
    RewriteRule ^/instructor/courses/?$ /src/pages/instructor/instructor-course.html [L]
    RewriteRule ^/instructor/course/add/?$ /src/pages/instructor/add-course.html [L]
    RewriteRule ^/instructor/students/?$ /src/pages/instructor/instructor-students.html [L]
    RewriteRule ^/instructor/profile/?$ /src/pages/instructor/instructor-profile.html [L]

    # Admin Dashboard
    RewriteRule ^/admin/?$ /src/pages/admin/admin-dashboard.html [L]
    RewriteRule ^/admin/dashboard/?$ /src/pages/admin/admin-dashboard.html [L]
    RewriteRule ^/admin/users/?$ /src/pages/admin/users-list.html [L]
    RewriteRule ^/admin/user/add/?$ /src/pages/admin/user-add.html [L]

    # Static pages
    RewriteRule ^/about/?$ /about.html [L]
    RewriteRule ^/contact/?$ /contact.html [L]

    #########################
    # REDIRECT OLD EXPOSED URLS TO CLEAN URLS
    #########################
    # 301 Permanent Redirects - Prevents users/search engines from accessing old URLs
    RewriteRule ^/src/pages/courses/course-grid\.html$ /courses [R=301,L]
    RewriteRule ^/src/pages/courses/course-list\.html$ /courses/list [R=301,L]
    RewriteRule ^/src/pages/courses/course-details\.html$ /course-details [R=301,L]
    RewriteRule ^/src/pages/auth/login\.html$ /login [R=301,L]
    RewriteRule ^/src/pages/auth/register\.html$ /register [R=301,L]

    # Generic redirects for any remaining src/pages URLs
    RewriteRule ^/src/pages/student/(.+)\.html$ /student/$1 [R=301,L]
    RewriteRule ^/src/pages/instructor/(.+)\.html$ /instructor/$1 [R=301,L]
    RewriteRule ^/src/pages/admin/(.+)\.html$ /admin/$1 [R=301,L]

    #########################
    # BACKEND API PROXY
    #########################
    # Proxy API requests to backend server (change to your backend URL)
    ProxyPreserveHost On
    ProxyPass /api http://your-backend-server:5000/api
    ProxyPassReverse /api http://your-backend-server:5000/api

    #########################
    # DIRECTORY CONFIGURATION
    #########################
    <Directory /path/to/alkahaf/frontend>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        # Security Headers
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-XSS-Protection "1; mode=block"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"

        # Content Security Policy
        Header always set Content-Security-Policy "default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; font-src 'self' data: https:; connect-src 'self' https:;"
    </Directory>

    # Protect hidden files
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    #########################
    # COMPRESSION & CACHING
    #########################

    # Enable Gzip Compression
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css
        AddOutputFilterByType DEFLATE text/javascript application/javascript application/json
        AddOutputFilterByType DEFLATE application/xml application/xhtml+xml
        AddOutputFilterByType DEFLATE image/svg+xml
    </IfModule>

    # Browser Caching
    <IfModule mod_expires.c>
        ExpiresActive On

        # Images - 1 year
        ExpiresByType image/jpeg "access plus 1 year"
        ExpiresByType image/png "access plus 1 year"
        ExpiresByType image/gif "access plus 1 year"
        ExpiresByType image/svg+xml "access plus 1 year"
        ExpiresByType image/webp "access plus 1 year"
        ExpiresByType image/x-icon "access plus 1 year"

        # CSS and JavaScript - 1 month
        ExpiresByType text/css "access plus 1 month"
        ExpiresByType application/javascript "access plus 1 month"

        # Fonts - 1 year
        ExpiresByType font/woff "access plus 1 year"
        ExpiresByType font/woff2 "access plus 1 year"
        ExpiresByType application/font-woff "access plus 1 year"
        ExpiresByType application/font-woff2 "access plus 1 year"

        # HTML - no cache (always fresh)
        ExpiresByType text/html "access plus 0 seconds"
    </IfModule>

    # Disable server signature
    ServerSignature Off

    # Error Log
    ErrorLog ${APACHE_LOG_DIR}/alkahaf-error.log
    CustomLog ${APACHE_LOG_DIR}/alkahaf-access.log combined
</VirtualHost>
