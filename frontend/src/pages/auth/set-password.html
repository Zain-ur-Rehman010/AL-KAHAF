<!DOCTYPE html>
<html lang="en">
	<head>

		<!-- Meta Tags -->
		<meta charset="utf-8">
		<meta http-equiv="X-UA-Compatible" content="IE=edge">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Set New Password | Al-Kahaf Online Academy</title>

		<!-- Favicon -->
		<link rel="shortcut icon" href="/assets/img/favicon.svg">
		<link rel="apple-touch-icon" href="/assets/img/apple-icon.png">

		<!-- Bootstrap CSS -->
		<link rel="stylesheet" href="/assets/css/bootstrap.min.css">

		<!-- Fontawesome CSS -->
		<link rel="stylesheet" href="/assets/plugins/fontawesome/css/fontawesome.min.css">
		<link rel="stylesheet" href="/assets/plugins/fontawesome/css/all.min.css">

		<!-- Slick CSS -->
		<link rel="stylesheet" href="/assets/plugins/slick/slick.css">
		<link rel="stylesheet" href="/assets/plugins/slick/slick-theme.css">

		<!-- Iconsax CSS -->
		<link rel="stylesheet" href="/assets/css/iconsax.css">

		<!-- Main CSS -->
		<link rel="stylesheet" href="/assets/css/style.css">
	<link rel="stylesheet" href="/assets/css/site-overrides.css">

	</head>
	<body>

		<div class="main-wrapper">
            <div class="login-content">
                <div class="row">
                    <!-- Login Banner -->
                    <div class="col-md-6 login-bg d-none d-lg-flex">
                        <div class="login-carousel">
                            <div>
                                <div class="login-carousel-section mb-3">
                                    <div class="login-banner">
                                        <img src="/assets/img/auth/auth-1.svg" class="img-fluid" alt="Logo">
                                    </div>
                                    <div class="mentor-course text-center">
                                        <h3 class="mb-2">Welcome to <br>Al-Kahaf<span class="text-secondary"> LMS</span> Courses.</h3>
                                        <p>Platform designed to help organizations, educators, and learners manage, deliver, and track learning and training activities.</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- /Login Banner -->

                    <div class="col-md-6 login-wrap-bg">
                        <div class="login-wrapper">
                            <div class="loginbox">
                                <div class="w-100">
                                    <div class="d-flex align-items-center justify-content-between login-header">
                                        <img src="/assets/img/white-logo.png" style="width: 150px;height: 130px;object-fit:contain;object-position:left center;margin-left:-30px;" class="img-fluid" alt="Logo">
                                        <a href="/auth/login" class="link-1">Back to Login</a>
                                    </div>
                                    <div class="topic">
                                        <h1 class="fs-32 fw-bold">Set New Password</h1>
                                        <p class="fw-normal fs-14 mb-0">Choose a strong password for your account.</p>
                                    </div>

                                    <div id="alert-box" class="alert d-none mb-3" role="alert"></div>

                                    <form id="set-password-form" class="mb-3 pb-3">
                                        <div class="mb-3 position-relative">
                                            <label class="form-label">New Password <span class="text-danger">*</span></label>
                                            <div class="position-relative" id="passwordInput">
                                                <input type="password" id="newPassword" class="pass-inputs form-control form-control-lg" placeholder="Enter new password" required>
                                                <span class="isax toggle-passwords isax-eye-slash text-gray-7 fs-14"></span>
                                            </div>
                                            <div class="password-strength" id="passwordStrength">
                                                <span id="poor"></span>
                                                <span id="weak"></span>
                                                <span id="strong"></span>
                                                <span id="heavy"></span>
                                            </div>
                                            <div class="mt-2" id="passwordInfo"></div>
                                        </div>

                                        <div class="mb-3 position-relative">
                                            <label class="form-label">Confirm Password <span class="text-danger">*</span></label>
                                            <div class="position-relative">
                                                <input type="password" id="confirmPassword" class="pass-inputa form-control form-control-lg" placeholder="Confirm new password" required>
                                                <span class="isax toggle-passworda isax-eye-slash text-gray-7 fs-14"></span>
                                            </div>
                                        </div>

                                        <div class="d-grid">
                                            <button id="submit-btn" class="btn btn-secondary btn-lg" type="submit">
                                                Set Password <i class="isax isax-arrow-right-3 ms-1"></i>
                                            </button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

		<!-- jQuery -->
		<script src="/assets/js/jquery-3.7.1.min.js"></script>
		<!-- Bootstrap Core JS -->
		<script src="/assets/js/bootstrap.bundle.min.js"></script>
		<!-- Slick Slider -->
		<script src="/assets/plugins/slick/slick.js"></script>
		<!-- Validation -->
		<script src="/assets/js/validation.js"></script>
		<!-- Custom JS -->
		<script src="/assets/js/script.js"></script>

	<button id="scroll-top" class="scroll-top" aria-label="Scroll to top">
		<i class="fas fa-arrow-up"></i>
	</button>

	<script>
		(function () {
			const API_BASE = (typeof API_CONFIG !== 'undefined') ? API_CONFIG.BASE_URL : 'https://api.alkahafonlineacademy.com/api/v1';
			const box = document.getElementById('alert-box');
			const btn = document.getElementById('submit-btn');

			// Guard: must have a reset token to be on this page
			const resetToken = localStorage.getItem('passwordResetToken');
			if (!resetToken) {
				box.className = 'alert alert-danger';
				box.textContent = 'Session expired or invalid. Please start the forgot password process again.';
				btn.disabled = true;
			}

			document.getElementById('set-password-form').addEventListener('submit', async function (e) {
				e.preventDefault();
				const newPassword     = document.getElementById('newPassword').value.trim();
				const confirmPassword = document.getElementById('confirmPassword').value.trim();

				if (newPassword.length < 6) {
					box.className = 'alert alert-warning';
					box.textContent = 'Password must be at least 6 characters.';
					return;
				}
				if (newPassword !== confirmPassword) {
					box.className = 'alert alert-warning';
					box.textContent = 'Passwords do not match.';
					return;
				}

				btn.disabled = true;
				btn.textContent = 'Saving...';

				try {
					const res = await fetch(API_BASE + '/auth/reset-password', {
						method: 'POST',
						headers: { 'Content-Type': 'application/json' },
						body: JSON.stringify({ resetToken, newPassword }),
					});
					const data = await res.json();
					box.className = 'alert alert-' + (data.success ? 'success' : 'danger');
					box.textContent = data.message;
					if (data.success) {
						localStorage.removeItem('passwordResetToken');
						setTimeout(() => { window.location.href = '/auth/login'; }, 1500);
					} else {
						btn.disabled = false;
						btn.innerHTML = 'Set Password <i class="isax isax-arrow-right-3 ms-1"></i>';
					}
				} catch (err) {
					box.className = 'alert alert-danger';
					box.textContent = 'Something went wrong. Please try again.';
					btn.disabled = false;
					btn.innerHTML = 'Set Password <i class="isax isax-arrow-right-3 ms-1"></i>';
				}
			});
		})();
	</script>
	</body>
</html>
