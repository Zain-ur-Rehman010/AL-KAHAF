<!DOCTYPE html> 
<html lang="en">
	<head>
	
		<!-- Meta Tags -->
		<meta charset="utf-8">
		<meta http-equiv="X-UA-Compatible" content="IE=edge">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		
		<title>Test Slider | Al-Kahaf Online Academy</title>

		<!-- Favicon -->
		<link rel="shortcut icon" href="/assets/img/favicon.svg"> 
		
		<!-- Bootstrap CSS -->
		<link rel="stylesheet" href="/assets/css/bootstrap.min.css">

		<!-- Swiper CSS -->
		<link rel="stylesheet" href="/assets/plugins/swiper/css/swiper-bundle.min.css">
		
		<!-- Fontawesome CSS -->
		<link rel="stylesheet" href="/assets/plugins/fontawesome/css/fontawesome.min.css">
		<link rel="stylesheet" href="/assets/plugins/fontawesome/css/all.min.css">

		<!-- Main CSS -->
		<link rel="stylesheet" href="/assets/css/style.css">
		
		<!-- Hero Slider CSS -->
		<link rel="stylesheet" href="/assets/css/hero-slider.css">
	
	</head>
	<body>

		<!-- Main Wrapper -->
		<div class="main-wrapper">
			
			<!-- Cursor Follower -->
			<div class="cursor-follower"></div>

			<!-- Include Hero Slider -->
			<div id="hero-slider-container"></div>

			<!-- Other content below slider -->
			<section class="py-5">
				<div class="container">
					<h2 class="text-center">Rest of your content goes here</h2>
				</div>
			</section>

		</div>

		<!-- Scripts -->
		<script src="/assets/js/jquery-3.7.1.min.js"></script>
		<script src="/assets/js/bootstrap.bundle.min.js"></script>
		<script src="/assets/plugins/fontawesome/js/fontawesome.min.js"></script>
		<script src="/assets/plugins/fontawesome/js/all.min.js"></script>
		<script src="/assets/plugins/swiper/js/swiper-bundle.min.js"></script>

		<!-- Load Hero Slider Component -->
		<script>
			// Load hero slider HTML
			fetch('hero-slider.html')
				.then(response => response.text())
				.then(html => {
					document.getElementById('hero-slider-container').innerHTML = html;
					// Initialize slider after HTML is loaded
					const script = document.createElement('script');
					script.src = 'assets/js/hero-slider.js';
					document.body.appendChild(script);
				})
				.catch(error => console.error('Error loading hero slider:', error));
		</script>
	<!-- Scroll to Top Button -->
	<button id="scroll-top" class="scroll-top" aria-label="Scroll to top">
		<i class="fas fa-arrow-up"></i>
	</button>


	</body>
</html>
