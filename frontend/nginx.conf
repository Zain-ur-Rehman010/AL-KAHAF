# AlKahaf Online Academy - Nginx Configuration
# This file provides clean URLs, security, and high performance
# Place this in /etc/nginx/sites-available/ and symlink to sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name alkahafonlineacademy.com www.alkahafonlineacademy.com;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name alkahafonlineacademy.com www.alkahafonlineacademy.com;

    # Document Root
    root /path/to/alkahaf/frontend;
    index index.html;

    # SSL Configuration (Let's Encrypt or your SSL certificate)
    ssl_certificate /path/to/ssl/fullchain.pem;
    ssl_certificate_key /path/to/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; font-src 'self' data: https:; connect-src 'self' https:;" always;

    # Hide Nginx version
    server_tokens off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    #########################
    # CLEAN URL REWRITES
    #########################

    # Home page
    location = /home {
        try_files /index.html =404;
    }

    # Course pages - CLEAN URLs (file structure hidden)
    location = /courses {
        try_files /src/pages/courses/course-grid.html =404;
    }

    location = /courses/grid {
        try_files /src/pages/courses/course-grid.html =404;
    }

    location = /courses/list {
        try_files /src/pages/courses/course-list.html =404;
    }

    location = /course-details {
        try_files /src/pages/courses/course-details.html =404;
    }

    # Authentication pages
    location = /login {
        try_files /src/pages/auth/login.html =404;
    }

    location = /register {
        try_files /src/pages/auth/register.html =404;
    }

    location = /forgot-password {
        try_files /src/pages/auth/forgot-password.html =404;
    }

    location = /reset-password {
        try_files /src/pages/auth/reset-password.html =404;
    }

    # Student Dashboard
    location = /student {
        try_files /src/pages/student/student-dashboard.html =404;
    }

    location = /student/dashboard {
        try_files /src/pages/student/student-dashboard.html =404;
    }

    location = /student/courses {
        try_files /src/pages/student/student-courses.html =404;
    }

    location = /student/course-play {
        try_files /src/pages/student/student-course-play.html =404;
    }

    location = /student/quiz {
        try_files /src/pages/student/student-quiz.html =404;
    }

    location = /student/profile {
        try_files /src/pages/student/student-profile.html =404;
    }

    location = /student/settings {
        try_files /src/pages/student/student-settings.html =404;
    }

    # Instructor Dashboard
    location = /instructor {
        try_files /src/pages/instructor/instructor-dashboard.html =404;
    }

    location = /instructor/dashboard {
        try_files /src/pages/instructor/instructor-dashboard.html =404;
    }

    location = /instructor/courses {
        try_files /src/pages/instructor/instructor-course.html =404;
    }

    location = /instructor/course/add {
        try_files /src/pages/instructor/add-course.html =404;
    }

    location = /instructor/students {
        try_files /src/pages/instructor/instructor-students.html =404;
    }

    location = /instructor/profile {
        try_files /src/pages/instructor/instructor-profile.html =404;
    }

    # Admin Dashboard
    location = /admin {
        try_files /src/pages/admin/admin-dashboard.html =404;
    }

    location = /admin/dashboard {
        try_files /src/pages/admin/admin-dashboard.html =404;
    }

    location = /admin/users {
        try_files /src/pages/admin/users-list.html =404;
    }

    location = /admin/user/add {
        try_files /src/pages/admin/user-add.html =404;
    }

    # Static pages
    location = /about {
        try_files /about.html =404;
    }

    location = /contact {
        try_files /contact.html =404;
    }

    #########################
    # REDIRECT OLD EXPOSED URLS TO CLEAN URLS
    #########################
    # 301 Permanent Redirects - Prevents access to file structure

    location ~ ^/src/pages/courses/course-grid\.html$ {
        return 301 /courses;
    }

    location ~ ^/src/pages/courses/course-list\.html$ {
        return 301 /courses/list;
    }

    location ~ ^/src/pages/courses/course-details\.html$ {
        return 301 /course-details;
    }

    location ~ ^/src/pages/auth/login\.html$ {
        return 301 /login;
    }

    location ~ ^/src/pages/auth/register\.html$ {
        return 301 /register;
    }

    # Block direct access to src/pages/* (except static assets)
    location ~ ^/src/pages/.*\.html$ {
        return 404;
    }

    #########################
    # BACKEND API PROXY
    #########################
    # Proxy API requests to backend server
    location /api/ {
        proxy_pass https://al-kahaf-production.up.railway.app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    #########################
    # STATIC ASSETS CACHING
    #########################

    # Images - 1 year cache
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # CSS and JavaScript - 1 month cache
    location ~* \.(css|js)$ {
        expires 1M;
        add_header Cache-Control "public";
        access_log off;
    }

    # Fonts - 1 year cache
    location ~* \.(woff|woff2|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # HTML - no cache (always fresh)
    location ~* \.(html)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
    }

    #########################
    # SECURITY
    #########################

    # Block access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block access to sensitive files
    location ~ \.(env|log|config)$ {
        deny all;
    }

    # Prevent directory listing
    autoindex off;

    #########################
    # DEFAULT LOCATION
    #########################
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Error pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;

    # Logging
    access_log /var/log/nginx/alkahaf-access.log;
    error_log /var/log/nginx/alkahaf-error.log;
}
